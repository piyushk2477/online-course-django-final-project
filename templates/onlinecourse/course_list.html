<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Online Courses</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">OnlineCourse</a><a class="btn btn-outline-light btn-sm" href="/admin/">Admin</a></div></nav><main class="container py-5"><h1 class="mb-4">Explore Courses</h1><div class="row g-4">{% for course in courses %}<div class="col-md-6 col-lg-4"><div class="card h-100 shadow-sm"><div class="card-body"><h2 class="h5">{{ course.name }}</h2><p>{{ course.description|default:'Explore lessons and test your knowledge.' }}</p><a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View course</a></div></div></div>{% empty %}<div class="col"><div class="alert alert-info">No courses yet. Add one through the <a href="/admin/">admin site</a>.</div></div>{% endfor %}</div></main></body></html>
